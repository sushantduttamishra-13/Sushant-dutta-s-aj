<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W AI - Chatbot</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090b12;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #25283a;
}

header h2 {
  margin: 0;
  color: #a78bfa;
}

#chat {
  height: calc(100vh - 155px);
  overflow-y: auto;
  padding: 20px;
  max-width: 850px;
  margin: auto;
}

.message {
  padding: 13px 16px;
  margin: 12px 0;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6546d7;
  margin-left: auto;
}

.bot {
  background: #191d2b;
  border: 1px solid #30354b;
  margin-right: auto;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 15px;
  background: #090b12;
}

.input-area {
  display: flex;
  gap: 10px;
  max-width: 850px;
  margin: auto;
}

input {
  flex: 1;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #30354b;
  background: #191d2b;
  color: white;
  outline: none;
}

button {
  padding: 0 22px;
  border: none;
  border-radius: 12px;
  background: #8055ed;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <h2>✦ W AI</h2>
  <p>Your personal AI assistant</p>
</header>

<div id="chat">
  <div class="message bot">
    Hello! I'm W AI. How can I help you today?
  </div>
</div>

<footer>
  <div class="input-area">
    <input id="prompt" placeholder="Ask anything..." />
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
</footer>

<script>
const API_URL =
"https://myaibackend.elonopboy0011.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const sendBtn = document.getElementById("send");

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message || sendBtn.disabled) return;

  addMessage(message, "user");
  input.value = "";
  sendBtn.disabled = true;

  const loading = addMessage("Thinking...", "bot");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    loading.textContent =
      data.reply || "No response received.";

  } catch (error) {
    loading.textContent =
      "Error: " + error.message;
  }

  sendBtn.disabled = false;
  input.focus();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
